# Checks from AGENTS.md ("Checks after a change") on every pull request into main
# or develop and on every push to them. The "Check components" job is a required
# status check in the rulesets for both branches, so a failing run blocks the merge.
# Keep the job name in step with those rulesets: renaming it blocks every PR.
name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check components
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the .md ↔ .mdx check can diff against the PR base.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck library (components and stories)
        run: npm run typecheck -w @chonny_iamsrithong/lab-package

      - name: Typecheck Storybook config
        run: npm run typecheck -w @lab-package/storybook

      - name: Build library
        run: npm run build -w @chonny_iamsrithong/lab-package

      - name: Check publish file list
        run: npm run pack:check -w @chonny_iamsrithong/lab-package

      - name: Build Storybook
        run: npm run build-storybook

      - name: Check dist and docs
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            node .github/scripts/verify.mjs --base "origin/${{ github.base_ref }}"
          else
            node .github/scripts/verify.mjs
          fi
